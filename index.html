<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JILI SUPER ACE</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0d0221,#1a0033);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .game{width:920px;max-width:100%;background:linear-gradient(180deg,#1a0033,#0d0221);border:4px solid #ffd700;padding:18px;border-radius:16px}
    .header{text-align:center;color:#ffd700;margin-bottom:12px}
    .reels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:rgba(0,0,0,0.05);padding:12px;border-radius:12px}
    .reel{display:flex;flex-direction:column;gap:8px}
    .cell{aspect-ratio:3/4;background:linear-gradient(135deg,#2a1a52,#1a0a32);border:2px solid #ff6600;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(255,215,0,0.6);overflow:hidden}
    .cell img{width:90%;height:90%;object-fit:contain;border-radius:8px;display:block}
    .cell.wild{box-shadow:0 0 20px #00ff88}
    .cell.scatter{box-shadow:0 0 20px #ffaa00}
    .cell.winning{animation:glow .6s ease-in-out infinite;border-color:#ffff00}
    @keyframes glow{0%{filter:drop-shadow(0 0 8px #ffd700)}50%{filter:drop-shadow(0 0 28px #ffd700)}100%{filter:drop-shadow(0 0 8px #ffd700)}}
    .controls{display:flex;gap:10px;justify-content:center;margin-top:12px}
    button{padding:12px 18px;border-radius:10px;border:0;background:#ff6600;color:#fff;font-weight:700;cursor:pointer}
    .stats{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
    .stat{background:rgba(255,215,0,0.06);padding:8px 12px;border-radius:8px;color:#ffd700}
  </style>
</head>
<body>
  <div class="game" role="application">
    <div class="header"><h1>🎰 JILI SUPER ACE</h1><div style="color:#ffb366">Image mode</div></div>

    <div class="stats" aria-live="polite">
      <div class="stat">Balance: <span id="balance">5000</span></div>
      <div class="stat">Last Win: <span id="lastWin">0</span></div>
      <div class="stat">Total Wins: <span id="totalWins">0</span></div>
    </div>

    <div class="reels" id="reels" aria-hidden="false"></div>

    <div class="controls">
      <button id="spinBtn">🎯 SPIN</button>
      <button id="turboBtn">⚡ TURBO</button>
      <button id="toggleSound">🔊 SOUND</button>
    </div>
  </div>

  <script type="module">
    // Only import firebase-app synchronously; analytics is loaded dynamically to avoid blocking the app
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDndzhlq7tIR03UZroax1iE59RXF27I4Z8",
      authDomain: "jili-c6b1a.firebaseapp.com",
      projectId: "jili-c6b1a",
      storageBucket: "jili-c6b1a.firebasestorage.app",
      messagingSenderId: "665157239109",
      appId: "1:665157239109:web:758500e566830c29b57e2c",
      measurementId: "G-YSZYWY42QB"
    };

    const app = initializeApp(firebaseConfig);
    let analyticsMod = null;
    let analytics = null;
    (async () => {
      try {
        analyticsMod = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js');
        analytics = analyticsMod.getAnalytics(app);
      } catch (e) {
        console.warn('Firebase analytics not available:', e);
        analyticsMod = null; analytics = null;
      }
    })();

    function safeLog(eventName, params = {}){
      try{ if(analyticsMod && analytics){ analyticsMod.logEvent(analytics, eventName, params); } }catch(e){}
    }

    // Sound manager
    class SoundManager {
      constructor(){ this.audioContext = null; this.enabled = true; }
      init(){ if(!this.audioContext) this.audioContext = new (window.AudioContext||window.webkitAudioContext)(); }
      async resumeIfNeeded(){ try{ this.init(); if(this.audioContext.state==='suspended') await this.audioContext.resume(); }catch(e){} }
      playBeep(freq=600,dur=0.08,vol=0.2){ if(!this.audioContext || !this.enabled) return; const o=this.audioContext.createOscillator(); const g=this.audioContext.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(this.audioContext.destination); o.start(); o.stop(this.audioContext.currentTime+dur); setTimeout(()=>{try{o.disconnect();g.disconnect()}catch(e){}},(dur+0.05)*1000); }
      spinSound(){ for(let i=0;i<6;i++) setTimeout(()=>this.playBeep(400+i*80,0.06,0.12), i*40); }
      winSound(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.playBeep(f,0.14,0.35), i*120)); }
      jackpotSound(){ [800,1000,1200,1400,1600,1400,1200,1000].forEach((f,i)=>setTimeout(()=>this.playBeep(f,0.09,0.25), i*90)); }
      toggle(){ this.enabled = !this.enabled; return this.enabled; }
    }

    const soundManager = new SoundManager();

    // Symbols mapped to image files
    const SYMBOL_POOL = [
      {id:'ace', name:'Ace', file:'assets/cards/ace.svg', weight:6, type:'face'},
      {id:'king',name:'King', file:'assets/cards/king.svg', weight:3, type:'face'},
      {id:'queen',name:'Queen', file:'assets/cards/queen.svg', weight:3, type:'face'},
      {id:'jack',name:'Jack', file:'assets/cards/jack.svg', weight:3, type:'face'},
      {id:'speed',name:'Speed', file:'assets/cards/speed.svg', weight:2, type:'symbol'},
      {id:'diamond',name:'Diamond', file:'assets/cards/diamond.svg', weight:2, type:'symbol'},
      {id:'heart',name:'Heart', file:'assets/cards/heart.svg', weight:2, type:'symbol'},
      {id:'clubs',name:'Clubs', file:'assets/cards/clubs.svg', weight:2, type:'symbol'}
    ];
    const WILD = {id:'wild', name:'Wild', file:'assets/cards/wild.svg', weight:0.1, type:'wild'};
    const SCATTER = {id:'scatter', name:'Scatter', file:'assets/cards/scatter-coin.svg', weight:0.05, type:'scatter'};

    const REELS = 5, ROWS = 4;

    function buildWeightedPool(){ const pool = []; SYMBOL_POOL.forEach(s=>{ const count = Math.max(1, Math.round(s.weight*10)); for(let i=0;i<count;i++) pool.push(s); }); const wildCount = Math.max(1, Math.round(WILD.weight*100)); for(let i=0;i<wildCount;i++) pool.push(WILD); const scatterCount = Math.max(1, Math.round(SCATTER.weight*100)); for(let i=0;i<scatterCount;i++) pool.push(SCATTER); return pool; }
    const WEIGHTED_POOL = buildWeightedPool();
    function weightedPick(){ return WEIGHTED_POOL[Math.floor(Math.random()*WEIGHTED_POOL.length)]; }

    // Game state
    const gameState = { balance:5000, bet:10, multiplier:1, isSpinning:false, lastWin:0, totalWins:0 };

    // Init DOM reels
    function initReels(){ const container = document.getElementById('reels'); container.innerHTML='';
      for(let c=0;c<REELS;c++){ const col = document.createElement('div'); col.className='reel'; col.id=`reel-${c}`;
        for(let r=0;r<ROWS;r++){ const cell = document.createElement('div'); cell.className='cell'; cell.id=`symbol-${c}-${r}`; const img = document.createElement('img'); img.className='card-image'; img.alt=''; cell.appendChild(img); col.appendChild(cell); }
        container.appendChild(col);
      }
      randomizeReels();
    }

    function getSymbolIdAt(c,r){ const img = document.querySelector(`#symbol-${c}-${r} img`); return img && img.dataset ? img.dataset.id : null; }

    function setImageWithFallback(img, s){ img.dataset.id = s.id; img.alt = s.name; img.src = s.file;
      img.onload = () => { /* loaded */ };
      img.onerror = () => {
        console.warn('Image failed to load', s.file);
        // use inline placeholder and annotate parent
        const parent = img.parentElement;
        parent.classList.remove('wild','scatter');
        parent.textContent = s.name[0] || '?';
        parent.style.fontSize = '2rem';
      };
    }

    function randomizeReels(){
      for(let c=0;c<REELS;c++){
        for(let r=0;r<ROWS;r++){
          const el = document.getElementById(`symbol-${c}-${r}`);
          if(!el) continue;
          // ensure the cell contains an img (fallback may have removed it)
          let img = el.querySelector('img');
          if(!img){ el.innerHTML = ''; img = document.createElement('img'); img.className='card-image'; el.appendChild(img); }
          const s = weightedPick();
          el.className = 'cell';
          if(s.type==='wild') el.classList.add('wild'); else if(s.type==='scatter') el.classList.add('scatter');
          setImageWithFallback(img, s);
        }
      }
    }

    function showMessage(text){ alert(text); }

    function checkWins(){
      let totalWin = 0; const winners = new Set();
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<REELS-2;c++){
          const s1 = getSymbolIdAt(c,r); const s2 = getSymbolIdAt(c+1,r); const s3 = getSymbolIdAt(c+2,r);
          if(!s1||!s2||!s3) continue;
          if(s1===s2 && s2===s3){
            let matchLength = 3; let payout = 1;
            for(let k=c+3;k<REELS;k++){ const next = getSymbolIdAt(k,r); if(next===s1) { matchLength++; if(matchLength===4) payout=2; if(matchLength===5) payout=3; } else break; }
            if(s1==='ace') payout *= 2.5; if(s1===WILD.id) payout *= 2.5; if(s1===SCATTER.id) payout *= 2;
            const baseWin = gameState.bet * (25 + matchLength * 10);
            totalWin += baseWin * payout * gameState.multiplier;
            for(let i=c;i<c+matchLength;i++) winners.add(`symbol-${i}-${r}`);
          }
        }
      }
      winners.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add('winning'); });

      // bonus counts
      let scatterCount=0, wildCount=0, aceCount=0;
      for(let c=0;c<REELS;c++) for(let r=0;r<ROWS;r++){ const id = getSymbolIdAt(c,r); if(id===SCATTER.id) scatterCount++; if(id===WILD.id) wildCount++; if(id==='ace') aceCount++; }
      if(scatterCount>=3){ const bonus = gameState.bet * 100; totalWin += bonus; soundManager.jackpotSound(); showMessage(`💥 SCATTER BONUS! +${bonus}`); }
      if(wildCount>=3){ const bonus = gameState.bet * 150; totalWin += bonus; soundManager.bonusSound(); showMessage(`🌟 WILD BONUS! +${bonus}`); }
      if(aceCount>=5){ const bonus = gameState.bet * 200; totalWin += bonus; soundManager.jackpotSound(); showMessage(`🎰 SUPER ACE! +${bonus}`); }

      return Math.floor(totalWin);
    }

    async function spin(isTurbo=false){
      if(gameState.isSpinning) return;
      await soundManager.resumeIfNeeded();
      const actualBet = gameState.bet * gameState.multiplier;
      if(gameState.balance < actualBet){ showMessage('❌ INSUFFICIENT BALANCE'); return; }
      gameState.isSpinning = true; gameState.balance -= actualBet; updateUI(); soundManager.spinSound();
      document.getElementById('spinBtn').disabled = true; document.getElementById('turboBtn').disabled = true;

      const duration = isTurbo ? 600 : 1500; const iterations = isTurbo ? 4 : 12; const per = Math.max(40, Math.floor(duration/iterations));
      for(let i=0;i<iterations;i++){
        document.querySelectorAll('.cell').forEach(c=>c.classList.add('spinning'));
        randomizeReels();
        await new Promise(r=>setTimeout(r, per));
        document.querySelectorAll('.cell').forEach(c=>c.classList.remove('spinning'));
      }

      randomizeReels(); await new Promise(r=>setTimeout(r, 260));
      const win = checkWins();
      if(win>0){ gameState.balance += win; gameState.lastWin = win; gameState.totalWins++; soundManager.winSound(); showMessage(`🎊 WIN! +${win} COINS! 🎊`); safeLog('spin_win', {win_amount: win, balance: gameState.balance, multiplier: gameState.multiplier, bet: gameState.bet}); }
      else { gameState.lastWin = 0; soundManager.playBeep(300,0.2,0.15); showMessage('Try Again!'); safeLog('spin_loss', {balance: gameState.balance, bet: gameState.bet}); }

      updateUI(); gameState.isSpinning = false; document.getElementById('spinBtn').disabled = false; document.getElementById('turboBtn').disabled = false;
      safeLog('spin', {turbo:isTurbo, multiplier:gameState.multiplier, bet:gameState.bet, balance:gameState.balance});
    }

    function updateUI(){ document.getElementById('balance').textContent = gameState.balance; document.getElementById('lastWin').textContent = gameState.lastWin; document.getElementById('totalWins').textContent = gameState.totalWins; }

    function increaseBet(){ if(gameState.bet < 1000){ gameState.bet += 10; gameState.multiplier = Math.floor(gameState.bet/10); soundManager.playBeep(700,0.06,0.12); updateUI(); safeLog('bet_increase',{new_bet:gameState.bet}); } }
    function decreaseBet(){ if(gameState.bet > 10){ gameState.bet -= 10; gameState.multiplier = Math.floor(gameState.bet/10); soundManager.playBeep(500,0.06,0.12); updateUI(); safeLog('bet_decrease',{new_bet:gameState.bet}); } }

    async function toggleSound(){ const enabled = soundManager.toggle(); const btn = document.getElementById('toggleSound'); btn.textContent = enabled? '🔊 SOUND' : '🔇 MUTE'; await soundManager.resumeIfNeeded(); if(enabled) soundManager.playBeep(800,0.08,0.2); }

    document.getElementById('spinBtn').addEventListener('click', ()=> spin(false));
    document.getElementById('turboBtn').addEventListener('click', ()=> spin(true));
    document.getElementById('toggleSound').addEventListener('click', ()=> toggleSound());

    // Init
    initReels(); updateUI(); safeLog('game_start', {starting_balance: gameState.balance});
    window.addEventListener('beforeunload', ()=> safeLog('game_end', {final_balance: gameState.balance, total_wins: gameState.totalWins}));
  </script>
</body>
</html>

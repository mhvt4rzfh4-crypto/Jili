<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Scatter coin">
  <defs>
    <radialGradient id="g" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="60%" stop-color="#ffd34d"/>
      <stop offset="100%" stop-color="#f0a500"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="url(#g)" stroke="#d79a00" stroke-width="8"/>
    <circle cx="150" cy="150" r="96" fill="rgba(255,255,255,0.06)"/>
  </g>
  <g transform="translate(0,10)">
    <text x="150" y="130" font-family="Georgia, serif" font-size="80" font-weight="700" text-anchor="middle" fill="#6a3a00">S</text>
    <rect x="52" y="170" width="196" height="48" rx="8" fill="#c84d00" stroke="#7a2000" stroke-width="2" />
    <text x="150" y="204" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#ffd76a">SCATTER</text>
  </g>
  <text x="18" y="288" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b3500">JILI SUPER ACE</text>
</svg>
